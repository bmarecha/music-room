services:
  db:
    image: docker.io/library/postgres:16-alpine
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    env_file: .env
    environment:
      # Address advertised by Metro, so a phone on the same network can load the bundle.
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_IP}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "8081:8081"
    depends_on:
      - backend

volumes:
  db_data:
